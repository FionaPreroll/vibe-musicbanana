name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        # Source database for the musicbanana-php import test.
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Builds use the committed .sqlx cache; tests need a server to create per-test databases.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      LEGACY_MYSQL_URL: mysql://root:root@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The pnpm version pinned in package.json (packageManager).
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run build

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: musicbanana:ci
          load: true
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image starts, migrates an empty database and serves API and frontend.
      - name: Smoke test
        run: |
          docker run -d --name musicbanana --network host \
            -e DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres \
            -e LISTEN_ADDR=127.0.0.1:3000 musicbanana:ci
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health
          curl -sf http://127.0.0.1:3000/u/nobody | grep -q '<html'
      - name: Container log
        if: always()
        run: docker logs musicbanana || true

  # Every push to main that passed the jobs above becomes
  # ghcr.io/fionapreroll/vibe-musicbanana:latest (and :sha-<commit>).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fionapreroll/vibe-musicbanana
          tags: |
            type=raw,value=latest
            type=sha
      # Same Dockerfile and commit as the docker job, so the layers come from its cache.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
