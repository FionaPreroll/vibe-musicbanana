# musicbanana with its own PostgreSQL, to run next to Navidrome.
#
#   cp .env.example .env    # then set the database password
#   docker compose pull     # the image CI publishes from main
#   docker compose up -d    # builds it from this checkout if it was not pulled
#
# The web interface and the scrobble API listen on port 3000 (MUSICBANANA_PORT).
# docs/installation.md has the Navidrome settings, tokens, moving
# existing data in, updates and backups.

name: musicbanana

services:
  musicbanana:
    image: ghcr.io/fionapreroll/vibe-musicbanana:latest
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://musicbanana:${MUSICBANANA_DB_PASSWORD:?set MUSICBANANA_DB_PASSWORD in .env}@db:5432/musicbanana
      ACCESS_LOG: ${ACCESS_LOG:-on}
      YOURSPOTIFY_ALLOWED_URLS: ${YOURSPOTIFY_ALLOWED_URLS:-}
      COVER_ART: ${COVER_ART:-off}
      COVER_ART_LOOKUP: ${COVER_ART_LOOKUP:-off}
      COVER_ART_CACHE_MAX: ${COVER_ART_CACHE_MAX:-1G}
      RUST_LOG: ${RUST_LOG:-musicbanana=info,tower_http=info}
    ports:
      - "${MUSICBANANA_PORT:-3000}:3000"
    volumes:
      # Album covers from the Cover Art Archive (docs/covers.md).
      - covers:/var/cache/musicbanana
    depends_on:
      db:
        condition: service_healthy

  # Imports Spotify plays from YourSpotify every so often. Starts only with
  # COMPOSE_PROFILES=yourspotify in .env, see .env.example.
  yourspotify:
    image: ghcr.io/fionapreroll/vibe-musicbanana:latest
    profiles: [yourspotify]
    restart: unless-stopped
    command: [import-yourspotify, --user, "${YOURSPOTIFY_USER:-}", --every, "${YOURSPOTIFY_EVERY:-15m}"]
    environment:
      DATABASE_URL: postgres://musicbanana:${MUSICBANANA_DB_PASSWORD:?set MUSICBANANA_DB_PASSWORD in .env}@db:5432/musicbanana
      YOURSPOTIFY_URL: ${YOURSPOTIFY_URL:-}
      YOURSPOTIFY_TOKEN: ${YOURSPOTIFY_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: musicbanana
      POSTGRES_PASSWORD: ${MUSICBANANA_DB_PASSWORD:?set MUSICBANANA_DB_PASSWORD in .env}
      POSTGRES_DB: musicbanana
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicbanana -d musicbanana"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db:
  covers:
